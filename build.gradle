apply plugin: 'com.huawei.ohos.app'

ohos {
    signingConfigs {
    }
    compileSdkVersion 6
}

buildscript {
    repositories {
        maven { url 'https://repo.huaweicloud.com/repository/maven/' }
        maven { url 'https://developer.huawei.com/repo/' }
    }
    dependencies {
        classpath 'com.huawei.ohos:hap:3.1.5.0'
    }
}

allprojects {
    repositories {
        maven { url 'https://repo.huaweicloud.com/repository/maven/' }
        maven { url 'https://developer.huawei.com/repo/' }
    }
}
